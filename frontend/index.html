<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#167563" />
    <meta name="description" content="Campusdesk keeps college complaints, conversations, and resolutions in one place." />
    <title>Campusdesk | Campus Support</title>
    <script>
      try {
        const preference = JSON.parse(localStorage.getItem("ccms_theme")) || "system";
        document.documentElement.dataset.theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
